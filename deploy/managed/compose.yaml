name: bubllio-core

services:
  installation-init:
    image: ghcr.io/apodimi/bubllio-core-installer@sha256:82f7bd7e6758bb575e36b07610bae143fd20a9314321ce86bb2a65309142472c
    pull_policy: always
    command: ["initialize-managed-compose"]
    environment:
      BUBLLIO_BASE_DOMAIN: ${BUBLLIO_BASE_DOMAIN:?Set the public Core domain}
      BUBLLIO_SETUP_SECRET: ${BUBLLIO_SETUP_SECRET:-}
    user: "0:0"
    network_mode: none
    volumes:
      - core_database_secret:/state/core-database
      - identity_database_secret:/state/identity-database
      - core_identity_secret:/state/core-identity
      - identity_agent_secret:/state/identity-agent
      - keycloak_bootstrap_secret:/state/keycloak-bootstrap
      - setup_material:/state/setup
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  core-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: bubllio_core
      POSTGRES_PASSWORD_FILE: /run/bubllio/core-database/password
      POSTGRES_USER: bubllio_core
    volumes:
      - core_database:/var/lib/postgresql/data
      - core_database_secret:/run/bubllio/core-database:ro
    networks:
      - core_data
    depends_on:
      installation-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bubllio_core -d bubllio_core"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  identity-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD_FILE: /run/bubllio/identity-database/password
      POSTGRES_USER: keycloak
    volumes:
      - identity_database:/var/lib/postgresql/data
      - identity_database_secret:/run/bubllio/identity-database:ro
    networks:
      - identity_data
    depends_on:
      installation-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  identity-vault-init:
    image: ghcr.io/apodimi/bubllio-core-keycloak@sha256:34dc2cfee08059450c8e3b220f8da0ff3b989ea97b67a4ebfbb52347e580f0e7
    pull_policy: always
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        umask 077;
        mkdir -p /opt/keycloak/vault;
        chown 1000:0 /opt/keycloak/vault;
        chmod 0700 /opt/keycloak/vault
    network_mode: none
    volumes:
      - identity_vault:/opt/keycloak/vault
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    restart: "no"

  identity-bootstrap:
    image: ghcr.io/apodimi/bubllio-core-keycloak@sha256:34dc2cfee08059450c8e3b220f8da0ff3b989ea97b67a4ebfbb52347e580f0e7
    pull_policy: always
    command:
      [
        "import",
        "--file=/opt/keycloak/data/import/bubllio-realm.json",
        "--override=false",
      ]
    environment:
      CORE_KEYCLOAK_CLIENT_SECRET_FILE: /run/bubllio/core-identity/client-secret
      KEYCLOAK_BOOTSTRAP_CLIENT_SECRET_FILE: /run/bubllio/keycloak-bootstrap/client-secret
      CORE_WEB_URL: https://${BUBLLIO_BASE_DOMAIN:?Set the public Core domain}
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/bubllio/identity-database/password
    volumes:
      - core_identity_secret:/run/bubllio/core-identity:ro
      - identity_database_secret:/run/bubllio/identity-database:ro
      - keycloak_bootstrap_secret:/run/bubllio/keycloak-bootstrap:ro
      - identity_vault:/opt/keycloak/vault:ro
    networks:
      - identity_data
    depends_on:
      identity-db:
        condition: service_healthy
      identity-vault-init:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  keycloak:
    image: ghcr.io/apodimi/bubllio-core-keycloak@sha256:34dc2cfee08059450c8e3b220f8da0ff3b989ea97b67a4ebfbb52347e580f0e7
    pull_policy: always
    command: ["start", "--optimized"]
    environment:
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD_FILE: /run/bubllio/identity-database/password
      KC_HOSTNAME: https://auth.${BUBLLIO_BASE_DOMAIN:?Set the public Core domain}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_VAULT: file
      KC_VAULT_DIR: /opt/keycloak/vault
    volumes:
      - identity_database_secret:/run/bubllio/identity-database:ro
      - identity_vault:/opt/keycloak/vault:ro
    networks:
      identity_control: {}
      identity_data: {}
      identity_public: {}
      smtp_egress:
        gw_priority: 1
    depends_on:
      identity-bootstrap:
        condition: service_completed_successfully
      identity-vault-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep 'HTTP/1.1 200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  identity-edge:
    image: nginxinc/nginx-unprivileged:1.29-alpine@sha256:0c79d56aee561a1d81c63f00eee5fb5fe29279560cdc55e91425133104c7fbe6
    pull_policy: always
    configs:
      - source: identity_edge_proxy
        target: /etc/nginx/nginx.conf
        mode: 0444
    networks:
      - edge
      - identity_public
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8080/realms/bubllio/.well-known/openid-configuration",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:mode=0755,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  identity-setup-agent:
    image: ghcr.io/apodimi/bubllio-core-identity-setup-agent@sha256:8d7153d9a5ece944b8a713ec249cc8ce76a057cdab4052416619baa6eeef03cc
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: "3200"
      IDENTITY_SETUP_AGENT_TOKEN_FILE: /run/bubllio/identity-agent/token
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_BOOTSTRAP_CLIENT_SECRET_FILE: /run/bubllio/keycloak-bootstrap/client-secret
      KEYCLOAK_RUNTIME_CLIENT_SECRET_FILE: /run/bubllio/core-identity/client-secret
    volumes:
      - core_identity_secret:/run/bubllio/core-identity:ro
      - identity_agent_secret:/run/bubllio/identity-agent:ro
      - keycloak_bootstrap_secret:/run/bubllio/keycloak-bootstrap:ro
      - identity_vault:/opt/keycloak/vault
    networks:
      - identity_control
      - smtp_egress
    depends_on:
      identity-vault-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(3200,'127.0.0.1').on('connect',function(){this.end()}).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  core-migrate:
    image: ghcr.io/apodimi/bubllio-core-migrate@sha256:5654a5a808397e67e4f50977074b8145858422af021fbad2debd8df21680783c
    pull_policy: always
    environment:
      CORE_DB_HOST: core-db
      CORE_DB_NAME: bubllio_core
      CORE_DB_PASSWORD_FILE: /run/bubllio/core-database/password
      CORE_DB_USER: bubllio_core
    volumes:
      - core_database_secret:/run/bubllio/core-database:ro
    networks:
      - core_data
    depends_on:
      core-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: "no"

  core-api:
    image: ghcr.io/apodimi/bubllio-core-api@sha256:d8d61d75cd6b4e06f54a24de2ad75d6c39547d76096aef1dc1d6809d398e3eb7
    pull_policy: always
    environment:
      NODE_ENV: production
      PORT: "3100"
      WEB_ORIGIN: https://${BUBLLIO_BASE_DOMAIN:?Set the public Core domain}
      OIDC_ISSUER: https://auth.${BUBLLIO_BASE_DOMAIN:?Set the public Core domain}/realms/bubllio
      OIDC_JWKS_URL: http://keycloak:8080/realms/bubllio/protocol/openid-connect/certs
      OIDC_AUDIENCE: bubllio-core-api
      CORE_DB_HOST: core-db
      CORE_DB_NAME: bubllio_core
      CORE_DB_PASSWORD_FILE: /run/bubllio/core-database/password
      CORE_DB_USER: bubllio_core
      CORE_KEYCLOAK_ADMIN_URL: http://keycloak:8080
      CORE_KEYCLOAK_CLIENT_SECRET_FILE: /run/bubllio/core-identity/client-secret
      CORE_IDENTITY_SETUP_AGENT_URL: http://identity-setup-agent:3200
      CORE_IDENTITY_SETUP_AGENT_TOKEN_FILE: /run/bubllio/identity-agent/token
      CORE_SETUP_CLAIM_ENABLED: "true"
      CORE_SETUP_LOCAL_REHEARSAL: "false"
      CORE_SETUP_MATERIAL_FILE: /run/bubllio/setup/material.json
      CORE_APPLICATION_MANIFEST_PATH: /app/config/applications.json
    volumes:
      - core_database_secret:/run/bubllio/core-database:ro
      - core_identity_secret:/run/bubllio/core-identity:ro
      - identity_agent_secret:/run/bubllio/identity-agent:ro
      - setup_material:/run/bubllio/setup:ro
    networks:
      - core_data
      - edge
      - identity_control
    depends_on:
      core-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      identity-setup-agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  core-web:
    image: ghcr.io/apodimi/bubllio-core-web@sha256:a68c4b09e917f7855ad433b58e487e1791cdbb2c28656dbd4aea5665134f74b5
    pull_policy: always
    environment:
      PORT: "8080"
      CORE_API_URL: https://api.${BUBLLIO_BASE_DOMAIN:?Set the public Core domain}
      KEYCLOAK_URL: https://auth.${BUBLLIO_BASE_DOMAIN:?Set the public Core domain}
    networks:
      - edge
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  core_database:
  identity_database:
  identity_vault:
  core_database_secret:
  identity_database_secret:
  core_identity_secret:
  identity_agent_secret:
  keycloak_bootstrap_secret:
  setup_material:

configs:
  identity_edge_proxy:
    file: ../identity-edge/nginx.conf

networks:
  core_data:
    internal: true
  identity_control:
    internal: true
  identity_data:
    internal: true
  identity_public:
    internal: true
  smtp_egress:
  edge:
    external: true
    name: ${BUBLLIO_EDGE_NETWORK:?Set the existing reverse-proxy Docker network}
