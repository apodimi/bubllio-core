openapi: 3.1.0
info:
  title: Bubllio Core API
  version: 1.0.0-draft
  description: >-
    Core first-run setup contract. The status, claim, current-state,
    organization, operation, and retry endpoints are implemented only for an
    explicitly enabled localhost rehearsal. Production setup remains disabled.
servers:
  - url: http://127.0.0.1:3100
    description: Local development
tags:
  - name: Setup
    description: One-time installation claim and first organization provisioning
paths:
  /api/v1/setup/status:
    get:
      operationId: getSetupStatus
      tags: [Setup]
      summary: Read the non-sensitive installation setup state
      security: []
      responses:
        "200":
          description: Setup availability without claimant or organization data
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/setup/claim:
    post:
      operationId: claimSetup
      tags: [Setup]
      summary: Bind an uninitialized installation to a verified human subject
      security:
        - oidcBearer: []
          setupSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "201":
          description: The caller owns the durable setup claim
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupClaim"
        "200":
          description: Idempotent replay by the existing claimant
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupClaim"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/SetupUnavailable"
        "409":
          $ref: "#/components/responses/SetupConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/setup/current:
    get:
      operationId: getMySetupState
      tags: [Setup]
      summary: Resume the current claimant's first-run state
      security:
        - oidcBearer: []
      responses:
        "200":
          description: The caller's claim or operation, without other claimant details
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentSetup"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/SetupUnavailable"
  /api/v1/setup/organization:
    post:
      operationId: startFirstOrganization
      tags: [Setup]
      summary: Persist and start the first organization provisioning operation
      security:
        - oidcBearer: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFirstOrganization"
      responses:
        "201":
          description: Provisioning completed within the bounded fast path
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOperation"
        "202":
          description: Durable provisioning continues asynchronously
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Location:
              schema:
                type: string
                example: /api/v1/setup/operations/018f48ec-6ec2-7f26-a87c-02ef32201dd9
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOperation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/NotClaimant"
        "409":
          $ref: "#/components/responses/SetupConflict"
        "422":
          $ref: "#/components/responses/ValidationFailed"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/setup/operations/{operationId}:
    parameters:
      - $ref: "#/components/parameters/OperationId"
    get:
      operationId: getSetupOperation
      tags: [Setup]
      summary: Read sanitized provisioning progress for the claimant
      security:
        - oidcBearer: []
      responses:
        "200":
          description: Current durable progress
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOperation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OperationNotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/setup/operations/{operationId}/retry:
    parameters:
      - $ref: "#/components/parameters/OperationId"
    post:
      operationId: retrySetupOperation
      tags: [Setup]
      summary: Resume a setup operation that needs operator attention
      security:
        - oidcBearer: []
          setupSecret: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/Origin"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        "202":
          description: The same durable operation was queued for reconciliation
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupOperation"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/OperationNotFound"
        "409":
          $ref: "#/components/responses/SetupConflict"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    oidcBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Core-audience OIDC access token issued by the configured realm
    setupSecret:
      type: apiKey
      in: header
      name: X-Bubllio-Setup-Secret
      description: Short-lived opaque installation secret; never log or persist it
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Reuse only for retries of the exact same canonical request
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: Must exactly match the configured trusted web origin
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  headers:
    NoStore:
      schema:
        type: string
        const: no-store, max-age=0
      description: Setup data must not be stored by browsers or intermediaries
  schemas:
    SetupStatus:
      type: object
      additionalProperties: false
      required: [setupRequired, phase]
      properties:
        setupRequired:
          type: boolean
        phase:
          type: string
          enum: [new, in_progress, ready]
          description: Coarse public installation phase; no owner identity or operation details
    SetupClaim:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [claimed, provisioning, needs_attention]
    CreateFirstOrganization:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 2
          maxLength: 120
          description: Unicode product organization name; the server derives its slug
    CurrentSetup:
      type: object
      additionalProperties: false
      required: [state]
      properties:
        state:
          type: string
          enum: [unclaimed, claimed, operation]
        operation:
          $ref: "#/components/schemas/SetupOperation"
    SetupOperation:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - stages
        - reauthenticationRequired
        - correlationId
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [pending, processing, awaiting_owner, succeeded, needs_attention]
        stages:
          type: array
          minItems: 4
          maxItems: 4
          items:
            $ref: "#/components/schemas/SetupStage"
        safeErrorCode:
          oneOf:
            - $ref: "#/components/schemas/SetupErrorCode"
            - type: "null"
        retryAfterSeconds:
          type: integer
          minimum: 1
        organizationId:
          type: string
          format: uuid
        reauthenticationRequired:
          type: boolean
        correlationId:
          type: string
          format: uuid
    SetupStage:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [core_organization, identity_organization, owner_membership, token_refresh]
        status:
          type: string
          enum: [queued, in_progress, complete, needs_attention]
    SetupErrorCode:
      type: string
      enum:
        - UNAUTHENTICATED
        - SETUP_UNAVAILABLE
        - SETUP_CLAIM_CONFLICT
        - SETUP_IDEMPOTENCY_CONFLICT
        - SETUP_INVALID_REQUEST
        - SETUP_REAUTHENTICATION_REQUIRED
        - KEYCLOAK_TEMPORARILY_UNAVAILABLE
        - KEYCLOAK_CREDENTIALS_INVALID
        - KEYCLOAK_PERMISSION_DENIED
        - KEYCLOAK_ORGANIZATION_CONFLICT
        - OWNER_INVITATION_PENDING
        - SETUP_REPAIR_REQUIRED
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, code, correlationId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
          format: uuid
  responses:
    Unauthenticated:
      description: Authentication is missing, invalid, stale, or insufficiently verified
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotClaimant:
      description: The authenticated subject does not own this setup claim
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    SetupUnavailable:
      description: Setup is unavailable without revealing why
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    SetupConflict:
      description: Setup state or idempotency conflicts with the request
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    OperationNotFound:
      description: Operation is absent or hidden from the caller
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ValidationFailed:
      description: Request validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RateLimited:
      description: The configured setup limit was exceeded
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
