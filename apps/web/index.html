<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#f7f8fa" />
    <title>Bubllio Core</title>
    <style>
      .boot-status {
        align-items: center;
        background: #f7f8fa;
        color: #17233f;
        display: flex;
        font:
          500 16px/1.5 system-ui,
          sans-serif;
        gap: 12px;
        justify-content: center;
        min-height: 100dvh;
      }
      .boot-status::before {
        border: 3px solid #cbd8fb;
        border-top-color: #2858df;
        border-radius: 50%;
        content: "";
        height: 20px;
        width: 20px;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-status::before {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-status" role="status" aria-label="Loading Bubllio…">
        Loading Bubllio…
      </div>
    </div>
    <script src="/runtime-config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
