services:
  mailpit:
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    environment:
      MP_LABEL: Bubllio Local Mail
      MP_MAX_MESSAGES: "500"
      MP_MAX_AGE: 7d
      MP_ALLOWED_HOSTS: localhost:${MAILPIT_UI_PORT:-8025},127.0.0.1:${MAILPIT_UI_PORT:-8025}
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  keycloak-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:-keycloak}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data

  core-db:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:-bubllio_core}
      POSTGRES_USER: ${CORE_DB_USER:-bubllio_core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - core_postgres_data:/var/lib/postgresql/data

  identity-vault-init:
    build:
      context: .
      dockerfile: infrastructure/keycloak/Dockerfile
    image: bubllio/keycloak:local
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        umask 077;
        mkdir -p /opt/keycloak/vault;
        chown 1000:0 /opt/keycloak/vault;
        chmod 0700 /opt/keycloak/vault
    network_mode: none
    volumes:
      - identity_secret_vault:/opt/keycloak/vault
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    restart: "no"

  keycloak:
    build:
      context: .
      dockerfile: infrastructure/keycloak/Dockerfile
    image: bubllio/keycloak:local
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Set KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Set KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
      KC_VAULT: file
      KC_VAULT_DIR: /opt/keycloak/vault
    depends_on:
      keycloak-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      identity-vault-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep 'HTTP/1.1 200 OK' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8180}:8080"
    restart: unless-stopped
    volumes:
      - ${KEYCLOAK_REALM_FILE:-./infrastructure/keycloak/realm-bubllio.local.json}:/opt/keycloak/data/import/realm-bubllio.json:ro
      - identity_secret_vault:/opt/keycloak/vault:ro

  identity-setup-agent:
    profiles: ["setup-rehearsal"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile.production
      target: identity-setup-agent
    image: bubllio/identity-setup-agent:local
    environment:
      NODE_ENV: production
      PORT: "3200"
      IDENTITY_SETUP_AGENT_TOKEN_FILE: /run/secrets/identity_setup_agent_token
      KEYCLOAK_ADMIN_URL: http://keycloak:8080
      KEYCLOAK_BOOTSTRAP_CLIENT_SECRET_FILE: /run/secrets/keycloak_bootstrap_client_secret
      KEYCLOAK_RUNTIME_CLIENT_SECRET_FILE: /run/secrets/core_identity_client_secret
      IDENTITY_SETUP_AGENT_ALLOW_INSECURE_SMTP: "true"
    secrets:
      - core_identity_client_secret
      - identity_setup_agent_token
      - keycloak_bootstrap_client_secret
    volumes:
      - identity_secret_vault:/opt/keycloak/vault
    depends_on:
      identity-vault-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:net').connect(3200,'127.0.0.1').on('connect',function(){this.end()}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  core-migrate:
    build:
      context: ./apps/api
      target: build
    command: ["npm", "run", "db:deploy"]
    environment:
      DATABASE_URL: postgresql://${CORE_DB_USER:-bubllio_core}:${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD}@core-db:5432/${CORE_DB_NAME:-bubllio_core}
    depends_on:
      core-db:
        condition: service_healthy
    restart: "no"

  core-api:
    build:
      context: ./apps/api
    environment:
      NODE_ENV: development
      PORT: "3100"
      OIDC_ISSUER: http://127.0.0.1:${KEYCLOAK_PORT:-8180}/realms/bubllio
      OIDC_JWKS_URL: http://keycloak:8080/realms/bubllio/protocol/openid-connect/certs
      OIDC_AUDIENCE: bubllio-core-api
      WEB_ORIGIN: http://127.0.0.1:${CORE_WEB_PORT:-5174}
      CORE_SETUP_LOCAL_REHEARSAL: ${CORE_SETUP_LOCAL_REHEARSAL:-false}
      CORE_SETUP_CLAIM_ENABLED: ${CORE_SETUP_CLAIM_ENABLED:-false}
      CORE_SETUP_SECRET_SHA256: ${CORE_SETUP_SECRET_SHA256:-}
      CORE_SETUP_SECRET_EXPIRES_AT: ${CORE_SETUP_SECRET_EXPIRES_AT:-}
      CORE_KEYCLOAK_ADMIN_URL: ${CORE_KEYCLOAK_ADMIN_URL:-}
      CORE_KEYCLOAK_CLIENT_SECRET: ${CORE_KEYCLOAK_CLIENT_SECRET:-}
      CORE_IDENTITY_SETUP_AGENT_URL: ${CORE_IDENTITY_SETUP_AGENT_URL:-}
      CORE_IDENTITY_SETUP_AGENT_TOKEN: ${CORE_IDENTITY_SETUP_AGENT_TOKEN:-}
      DATABASE_URL: postgresql://${CORE_DB_USER:-bubllio_core}:${CORE_DB_PASSWORD:?Set CORE_DB_PASSWORD}@core-db:5432/${CORE_DB_NAME:-bubllio_core}
    depends_on:
      core-db:
        condition: service_healthy
      core-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      identity-setup-agent:
        condition: service_healthy
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${CORE_API_PORT:-3100}:3100"

  core-web:
    profiles: ["setup-rehearsal"]
    build:
      context: ./apps/web
      dockerfile: Dockerfile.local
    environment:
      VITE_KEYCLOAK_URL: http://127.0.0.1:${KEYCLOAK_PORT:-8180}
      VITE_CORE_API_URL: http://127.0.0.1:${CORE_API_PORT:-3100}
    depends_on:
      core-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/setup').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${CORE_WEB_PORT:-5174}:5174"

volumes:
  core_postgres_data:
  keycloak_postgres_data:
  identity_secret_vault:

secrets:
  core_identity_client_secret:
    file: ${CORE_IDENTITY_CLIENT_SECRET_FILE:-.local/core-identity-client-secret}
  identity_setup_agent_token:
    file: ${IDENTITY_SETUP_AGENT_TOKEN_FILE:-.local/identity-setup-agent-token}
  keycloak_bootstrap_client_secret:
    file: ${KEYCLOAK_BOOTSTRAP_CLIENT_SECRET_FILE:-.local/keycloak-bootstrap-client-secret}
