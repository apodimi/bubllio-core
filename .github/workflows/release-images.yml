name: Release immutable Core images

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: core-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            apps/api/package-lock.json
            apps/web/package-lock.json
            apps/keycloak-theme/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Verify API
        working-directory: apps/api
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run format:check
          npm test
          npm run build
      - name: Verify web
        working-directory: apps/web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run format:check
          npm run build
      - name: Verify identity theme
        working-directory: apps/keycloak-theme
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build:keycloak
      - name: Verify portable contract and Compose adapter
        run: |
          node scripts/prepare-installation.mjs \
            --contract deploy/contract/bubllio-installation.example.json \
            --output-dir /tmp/bubllio-installation >/dev/null
          node deploy/adapter-conformance/verify.mjs \
            --contract deploy/contract/bubllio-installation.example.json \
            --env-file /tmp/bubllio-installation/compose.env \
            --validate-only
      - name: Install browser test runtime
        working-directory: apps/web
        run: npx playwright install --with-deps chrome
      - name: Start local identity and API fixture
        run: docker compose --env-file .env.example up -d --build --wait keycloak core-api
      - name: Verify browser identity and setup journeys
        working-directory: apps/web
        run: npm run test:e2e
      - name: Stop local fixture
        if: always()
        run: docker compose --env-file .env.example down

  publish:
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core-api
            key: coreApi
            dockerfile: apps/api/Dockerfile.production
            target: runtime
          - image: core-migrate
            key: coreMigrate
            dockerfile: apps/api/Dockerfile.production
            target: migration
          - image: core-identity-setup-agent
            key: identitySetupAgent
            dockerfile: apps/api/Dockerfile.production
            target: identity-setup-agent
          - image: core-web
            key: coreWeb
            dockerfile: apps/web/Dockerfile.production
            target: runtime
          - image: core-keycloak
            key: keycloak
            dockerfile: infrastructure/keycloak/Dockerfile.production
            target: runtime
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bubllio-${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=ref,event=tag
      - name: Refuse mutable release tags
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          if grep -Eq '(^|[[:space:]])[^[:space:]]+:latest($|[[:space:]])' <<<"$IMAGE_TAGS"; then
            echo "Mutable latest tags are forbidden" >&2
            exit 1
          fi
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Generate downloadable SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository_owner }}/bubllio-${{ matrix.image }}@${{ steps.build.outputs.digest }}
          artifact-name: ${{ matrix.image }}.spdx.json
          format: spdx-json
          output-file: ${{ matrix.image }}.spdx.json
          upload-release-assets: false
      - name: Record immutable image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/bubllio-${{ matrix.image }}
          KEY: ${{ matrix.key }}
          NAME: ${{ matrix.image }}
        run: |
          mkdir -p release-fragment
          node -e "require('node:fs').writeFileSync('release-fragment/' + process.env.NAME + '.json', JSON.stringify({key: process.env.KEY, image: process.env.IMAGE + '@' + process.env.DIGEST}) + '\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.image }}
          path: release-fragment/${{ matrix.image }}.json
          if-no-files-found: error

  release-manifest:
    needs: publish
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: release-fragments
          merge-multiple: true
      - name: Build release manifest
        env:
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          node -e "const fs=require('node:fs'); const images=Object.fromEntries(fs.readdirSync('release-fragments').sort().map(file=>{const item=JSON.parse(fs.readFileSync('release-fragments/'+file)); if(!/@sha256:[a-f0-9]{64}$/.test(item.image)||item.image.includes(':latest'))throw new Error('Invalid immutable image reference'); return [item.key,item.image]})); if(JSON.stringify(Object.keys(images).sort())!==JSON.stringify(['coreApi','coreMigrate','coreWeb','identitySetupAgent','keycloak']))throw new Error('Release manifest image set is incomplete'); fs.writeFileSync('release-manifest.json',JSON.stringify({schemaVersion:'1',releaseRef:process.env.RELEASE_REF,commitSha:process.env.COMMIT_SHA,images},null,2)+'\n')"
      - uses: actions/upload-artifact@v4
        with:
          name: bubllio-core-release-${{ github.sha }}
          path: release-manifest.json
          if-no-files-found: error
